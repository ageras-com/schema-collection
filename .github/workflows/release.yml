# Source: shine-foundation/tf-github-modules, modules/components/release
name: Release
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    # release-please runs as the shine-release-please App (installed by the module): its release PR triggers CI,
    # and it may create the release tags.
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: shine-foundation/github-actions/.github/workflows/delivery__release-please.yml@v1
    with:
      release-type: simple
      path: "."
      tag-major: true
