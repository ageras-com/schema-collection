# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# This file is managed by Terraform. Do not edit it directly.
# To make changes, update the dependabot block for this repository in https://github.com/ageras-com/tf-github
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 1
    groups:
      internal-github-actions:
        patterns:
          - "shinetools/github-actions"
          - "shinetools/github-actions/**"
          - "ageras-com/github-actions"
          - "ageras-com/github-actions/**"
          - "billysbilling/github-actions"
          - "billysbilling/github-actions/**"
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
