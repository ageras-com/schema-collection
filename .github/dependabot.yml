---
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
        - /
      schedule:
        interval: daily
        time: "06:00"
        timezone: Europe/Paris
      open-pull-requests-limit: 15
      groups:
        github-actions-minor-and-patch:
            patterns:
                - '*'
            update-types:
                - minor
                - patch
        internal-github-actions:
            patterns:
                - shinetools/github-actions
                - shinetools/github-actions/**
                - ageras-com/github-actions
                - ageras-com/github-actions/**
                - billysbilling/github-actions
                - billysbilling/github-actions/**
      cooldown:
        default-days: 1
